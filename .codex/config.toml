# Project-local Codex CLI / VS Code extension configuration for this checkout.
# Serena is pinned and runtime-verified; see docs/source_scout_direction.md.
[mcp_servers.serena]
command = 'C:\AI\Dev\source_scout\.source_scout\tools\serena-venv\Scripts\serena.exe'
args = ['start-mcp-server', '--project-from-cwd', '--context', 'C:\AI\Dev\source_scout\config\serena-context.yml', '--mode', 'no-memories', '--enable-web-dashboard', 'false', '--open-web-dashboard', 'false', '--enable-gui-log-window', 'false']
enabled = true
startup_timeout_sec = 60
tool_timeout_sec = 120
enabled_tools = ['initial_instructions', 'get_current_config', 'get_symbols_overview', 'find_symbol', 'find_referencing_symbols', 'find_declaration']

[mcp_servers.serena.env]
UV_TOOL_DIR = 'C:\AI\Dev\source_scout\.source_scout\tools\uv-tools'
SERENA_HOME = 'C:\AI\Dev\source_scout\.source_scout\serena-home'
UVX = 'C:\AI\Dev\source_scout\.source_scout\tools\serena-venv\Scripts\uvx.exe'
UV_CACHE_DIR = 'C:\AI\Dev\source_scout\.source_scout\tools\uv-cache'
UV_PYTHON_INSTALL_DIR = 'C:\AI\Dev\source_scout\.source_scout\tools\uv-python'
