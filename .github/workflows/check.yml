name: Offline product contracts
on: [push, pull_request]
jobs:
  check:
    name: check (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m venv .venv
      - run: .venv\Scripts\python.exe -m pip install -e ".[all,dev]"
      - name: Local checks (no external HTTP or model calls)
        run: .venv\Scripts\python.exe -m source_scout check --format json
